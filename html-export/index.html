<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fffcf6">
  <meta name="description" content="温柔地记录行动，让每一条人生支线都通向更好的自己。">
  <title>人生支线工作台 · HTML 版</title>
  <link rel="icon" href="assets/icon-preview/flower_coral.png">
  <link rel="stylesheet" href="workbench.css">
  <script src="workbench.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <button class="icon-btn" id="menuButton" aria-label="菜单"><span class="menu-lines" aria-hidden="true">☰</span></button>
      <h1 id="pageTitle">人生支线工作台 <span class="spark">✦</span></h1>
      <button class="date" aria-label="选择日期"><img class="icon" src="assets/icon-preview/calendar_coral.png" alt=""><span id="dateLabel"></span></button>
    </header>
    <main>
      <section class="page active" data-page="home" aria-label="今日首页"></section>
      <section class="page" data-page="branches" aria-label="我的支线"></section>
      <section class="page" data-page="learning" aria-label="学习成长"></section>
      <section class="page" data-page="project" aria-label="项目计划"></section>
      <section class="page" data-page="insights" aria-label="本周洞察"></section>
      <section class="page" data-page="profile" aria-label="个人中心"></section>
    </main>
    <nav class="bottom" aria-label="底部导航">
      <button class="nav active" data-nav="home"><span class="nav-symbol">⌂</span><span>首页</span></button>
      <button class="nav" data-nav="branches"><img src="assets/icon-preview/puzzle_coral.png" alt=""><span>支线</span></button>
      <button class="add" aria-label="打开快速记录" data-record="sleep">+</button>
      <button class="nav" data-nav="insights"><span class="bars" aria-hidden="true"><i></i><i></i></span><span>洞察</span></button>
      <button class="nav" data-nav="profile"><span class="person-symbol" aria-hidden="true"></span><span>我的</span></button>
    </nav>
  </div>
  <div class="overlay" id="recordOverlay" role="dialog" aria-modal="true" aria-labelledby="recordTitle">
    <div class="sheet record-sheet" tabindex="-1">
      <div class="grab"></div><button class="close" data-close-overlay aria-label="关闭">×</button>
      <div class="record-title"><img src="assets/clean/illustrations/01-rabbit-writing.png" alt="写日记的小兔"><div><h2 id="recordTitle">快速记录 <span class="spark">✦</span></h2><p>随手记下当下，为更好的自己打卡 <span class="spark">✦</span></p></div></div>
      <div class="tabs record-tabs" role="tablist" aria-label="记录类型">
        <button class="tab" type="button" data-tab="exercise" role="tab"><img src="assets/clean/illustrations/14-sneaker-icon.png" alt="">运动</button>
        <button class="tab active" type="button" data-tab="sleep" role="tab"><img src="assets/clean/illustrations/11-crescent-moon-sparkles.png" alt="">睡眠</button>
        <button class="tab" type="button" data-tab="finance" role="tab"><span class="coin">¥</span>收支</button>
        <button class="tab" type="button" data-tab="idea" role="tab"><span class="idea-icon">♧</span>想法</button>
      </div>
      <form id="recordForm">
        <div class="record-form card">
          <div class="form-panel" data-panel="exercise"><label class="field"><span>运动时长（分钟）</span><input type="number" name="exercise" min="1" max="600" value="20" required></label><label class="field"><span>运动类型</span><select name="exerciseType"><option>力量训练</option><option>散步</option><option>跑步</option><option>瑜伽</option><option>其他</option></select></label></div>
          <div class="form-panel active" data-panel="sleep">
            <div class="time-grid"><label class="field time-field"><span>☾ 睡觉时间</span><input type="time" name="sleepStart" aria-label="睡觉时间" value="22:30" required></label><label class="field time-field"><span>☀ 起床时间</span><input type="time" name="sleepEnd" aria-label="起床时间" value="06:30" required></label></div>
            <div class="quality-field"><label for="sleepQuality">☾ 睡眠质量</label><output id="qualityValue" for="sleepQuality">82分</output><input id="sleepQuality" name="quality" aria-label="睡眠质量" type="range" min="0" max="100" value="82"><div><small>很差</small><small>较差</small><small>一般</small><small>良好</small><small>很好</small></div></div>
            <fieldset class="sleep-status"><legend>☾ 睡眠状态</legend><div class="choice-row"><button type="button" data-sleep-status="fast" class="active" aria-pressed="true"><span>☺</span>入睡快</button><button type="button" data-sleep-status="normal" aria-pressed="false"><span>😐</span>一般</button><button type="button" data-sleep-status="light" aria-pressed="false"><span>☹</span>易醒</button></div></fieldset>
          </div>
          <div class="form-panel" data-panel="finance"><div class="time-grid"><label class="field"><span>金额</span><input type="number" name="amount" min="0.01" max="100000000" step="0.01" value="10" required></label><label class="field"><span>类型</span><select name="financeType" aria-label="类型"><option value="income">收入</option><option value="expense">支出</option></select></label></div></div>
          <div class="form-panel" data-panel="idea"><label class="field"><span>记录灵感</span><textarea name="idea" placeholder="闪现的想法，值得被认真收好…" maxlength="2000" required></textarea></label></div>
          <label class="field note-field"><span id="noteLabel">☾ 睡眠备注 <small>（可选）</small></span><textarea name="note" maxlength="100" placeholder="记录一下昨晚的睡眠感受吧～"></textarea><small id="noteCount">0/100</small><img src="assets/clean/illustrations/06-rabbit-flower-notebook.png" alt=""></label>
        </div>
        <div class="section-title"><h3><span class="spark">✦</span> 常用快捷记录</h3><small id="recordDateHint"></small></div>
        <div class="record-shortcuts"><button type="button" data-tab="exercise"><img src="assets/clean/illustrations/14-sneaker-icon.png" alt=""><span>记运动<small>打卡运动时长</small></span>›</button><button type="button" data-tab="finance"><span class="coin">¥</span><span>记收入<small>记录一笔收入</small></span>›</button><button type="button" data-tab="idea"><span class="idea-icon">♧</span><span>记灵感<small>闪现一个想法</small></span>›</button></div>
        <button class="primary save" type="submit">✦　保存记录　✦</button>
      </form>
    </div>
  </div>
  <div class="overlay" id="menuOverlay" role="dialog" aria-modal="true" aria-labelledby="menuTitle"><div class="sheet compact-sheet" tabindex="-1"><div class="grab"></div><button class="close" data-close-overlay aria-label="关闭导航">×</button><h2 id="menuTitle">页面导航 <span class="spark">✦</span></h2><div class="menu-list"><button data-open-page="home">今日首页 ›</button><button data-open-page="branches">我的支线 ›</button><button data-open-page="learning">学习成长 ›</button><button data-open-page="project">项目计划 ›</button><button data-open-page="insights">本周洞察 ›</button><button data-open-page="profile">我的 ›</button></div></div></div>
  <div class="overlay" id="dateOverlay" role="dialog" aria-modal="true" aria-labelledby="dateTitle"><div class="sheet compact-sheet" tabindex="-1"><div class="grab"></div><button class="close" data-close-overlay aria-label="关闭日期选择">×</button><h2 id="dateTitle">选择日期 <span class="spark">✦</span></h2><label class="field"><span>工作台日期</span><input id="dateInput" type="date" required></label><button class="primary save" id="saveDateButton">保存日期</button><button class="text-button" id="todayButton">回到今天</button></div></div>
  <div class="overlay center" id="focusOverlay" role="dialog" aria-modal="true" aria-labelledby="focusTitle"><div class="focus-card" tabindex="-1"><button class="close" data-close-overlay aria-label="收起专注">−</button><img src="assets/clean/illustrations/07-rabbit-moon-mug.png" alt="陪伴专注的小兔"><p class="eyebrow">给重要的事，一点完整的时间</p><h2 id="focusTitle">词汇学习 80 个</h2><strong id="focusTime">00:00</strong><p id="focusStatus">正在专注，慢慢来就很好</p><div class="focus-actions"><button id="pauseFocus" class="secondary">暂停</button><button id="finishFocus" class="primary">结束并保存</button></div><small>按实际专注时间保存，未满一分钟也会保留。</small></div></div>
  <button class="focus-pill" id="focusPill" hidden>▷ 专注中 <span>00:00</span></button>
  <div class="overlay" id="editOverlay" role="dialog" aria-modal="true" aria-labelledby="editTitle"><div class="sheet compact-sheet" tabindex="-1"><div class="grab"></div><button class="close" data-close-overlay aria-label="关闭编辑">×</button><h2 id="editTitle">编辑任务</h2><form id="taskForm"><input type="hidden" name="id"><label class="field"><span>任务名称</span><input name="title" maxlength="80" required></label><div class="time-grid"><label class="field"><span>预计分钟</span><input name="minutes" type="number" min="1" max="600" required></label><label class="field"><span>任务分组</span><select name="bucket"><option value="today">今日必须</option><option value="week">本周推进</option><option value="later">可延后</option></select></label></div><label class="field"><span>学习分类</span><select name="category"><option value="english">英语</option><option value="reading">阅读</option><option value="specialty">专业</option></select></label><button class="primary save">保存任务</button><button class="text-button danger" id="deleteTask" type="button">删除任务</button></form></div></div>
  <div class="overlay" id="noteOverlay" role="dialog" aria-modal="true" aria-labelledby="noteTitle"><div class="sheet compact-sheet" tabindex="-1"><div class="grab"></div><button class="close" data-close-overlay aria-label="关闭笔记">×</button><h2 id="noteTitle">学习笔记 <span class="spark">✦</span></h2><form id="noteForm"><input type="hidden" name="id"><label class="field"><span>笔记标题</span><input name="title" required maxlength="80" placeholder="今天学到了什么？"></label><label class="field"><span>笔记内容</span><textarea name="content" required maxlength="10000" placeholder="用自己的话，记录一点新的理解…"></textarea></label><button class="primary save">保存笔记</button><button class="text-button danger" type="button" id="deleteNote">删除笔记</button></form></div></div>
  <div class="overlay" id="listOverlay" role="dialog" aria-modal="true" aria-labelledby="listTitle"><div class="sheet compact-sheet" tabindex="-1"><div class="grab"></div><button class="close" data-close-overlay aria-label="关闭列表">×</button><h2 id="listTitle"></h2><div id="listContent"></div></div></div>
  <div class="overlay" id="importOverlay" role="dialog" aria-modal="true" aria-labelledby="importTitle"><div class="sheet compact-sheet" tabindex="-1"><div class="grab"></div><button class="close" data-close-overlay aria-label="关闭恢复">×</button><h2 id="importTitle">恢复数据备份</h2><p id="importSummary"></p><p class="muted">恢复会替换当前数据。你可以先导出当前备份。</p><button class="primary save" id="confirmImport">确认恢复</button></div></div>
  <input id="importFile" type="file" accept=".json,application/json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p>请启用浏览器 JavaScript 以使用记录与专注功能。</p></noscript>
</body>
</html>
